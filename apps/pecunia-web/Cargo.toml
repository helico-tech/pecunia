[package]
name = "pecunia-web"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Pecunia in the browser: the egui UI as wasm, editing a local file (pecunia.helico.app)"

[lints]
workspace = true

[dependencies]
pecunia-engine = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
pecunia-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }

[dev-dependencies]
serde_json = { workspace = true }
