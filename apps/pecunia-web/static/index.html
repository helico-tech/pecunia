<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The app draws its own UI: no page zoom (it would blur the canvas); the keyboard shrinks the canvas, not covers it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191a1e" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Pecunia</title>
  <meta name="description" content="Pecunia: local-first household budgeting. Import your bank files, sort your spending, keep money in pots. Your book stays a file on your own computer.">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Pecunia">
  <style>
    html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; background: #ffffff; }
    @media (prefers-color-scheme: dark) { html, body { background: #191a1e; } }
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 16px; text-align: center; font: 14px system-ui, sans-serif; color: #8a8f98; }
  </style>
  <script type="module" src="boot.js"></script>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="loading">Loading Pecunia…</div>
  <noscript>Pecunia needs JavaScript and WebAssembly.</noscript>
</body>
</html>
