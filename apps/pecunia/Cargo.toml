[package]
name = "pecunia"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "pecunia"
description = "Pecunia desktop app"

[lints]
workspace = true

[dependencies]
pecunia-engine = { workspace = true }
pecunia-ui-egui = { workspace = true }
craft-atomic = { workspace = true }
craft-quit = { workspace = true, features = ["egui"] }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
